name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (see eas.json)
        type: choice
        options: [preview, production]
        default: preview

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # Android only for now — add an "ios" job the same way (with a "production"/"preview" profile
  # of its own) once there's an Apple developer account / credentials to build with.
  #
  # Manual only: trigger this from the Actions tab (branch = main, pick a profile) when you
  # actually want a build — e.g. cutting a release. It doesn't run on every push to main or PR,
  # since EAS build minutes are limited on the free tier and most pushes don't need a new build.
  build-android:
    name: Build (Android)
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive
