<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="22%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#2A2830"/>
      <stop offset="100%" stop-color="#1C1B1F"/>
    </radialGradient>
    <linearGradient id="cardTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C2B31"/>
      <stop offset="100%" stop-color="#242328"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- ticket perforation divider, decorative, right side -->
  <g opacity="0.35">
    <line x1="640" y1="60" x2="640" y2="440" stroke="#49454F" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
  </g>

  <!-- brand mark -->
  <rect x="72" y="86" width="76" height="76" rx="18" fill="#6750A4"/>
  <g transform="translate(90,104)" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="7" width="40" height="26" rx="4"/>
    <path d="M0 16c2.4 0 2.4-2.4 0-2.4"/>
    <path d="M40 16c-2.4 0-2.4-2.4 0-2.4"/>
    <path d="M11 20l5 5 10-10"/>
  </g>

  <!-- wordmark -->
  <text x="172" y="148" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="52" font-weight="700" letter-spacing="1" fill="#FFFFFF">PUNCH</text>

  <!-- tagline -->
  <text x="74" y="228" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="500" fill="#E6E1E5">Track prepaid session packs</text>
  <text x="74" y="270" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="500" fill="#E6E1E5">Swipe to check in.</text>

  <!-- feature bullets -->
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="22" fill="#CAC4D0">
    <circle cx="82" cy="336" r="4" fill="#D0BCFF"/>
    <text x="98" y="343">Coworking, gym, classes — any bundle of visits</text>

    <circle cx="82" cy="374" r="4" fill="#D0BCFF"/>
    <text x="98" y="381">Expiry tracking, right on the card</text>

    <circle cx="82" cy="412" r="4" fill="#D0BCFF"/>
    <text x="98" y="419">No account, no server, no ads</text>
  </g>

  <!-- mock pack card stack -->
  <g transform="translate(700,150) rotate(4)">
    <!-- back card (teal) -->
    <rect x="18" y="26" width="270" height="150" rx="20" fill="#242328" stroke="#3A383F" stroke-width="1"/>
    <rect x="18" y="26" width="6" height="150" rx="3" fill="#00696B"/>
  </g>
  <g transform="translate(700,150) rotate(4)">
    <!-- front card (indigo) -->
    <rect x="0" y="0" width="270" height="150" rx="20" fill="url(#cardTeal)" stroke="#3A383F" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="150" rx="3" fill="#4655A8"/>

    <text x="30" y="42" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#E6E1E5">Coworking</text>

    <text x="30" y="78" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#8C9BE0">18<tspan font-size="16" font-weight="400" fill="#CAC4D0"> / 24 left</tspan></text>

    <rect x="30" y="96" width="212" height="8" rx="4" fill="#49454F"/>
    <rect x="30" y="96" width="159" height="8" rx="4" fill="#4655A8"/>

    <text x="30" y="130" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#EFB8C8">Expires in 29 days</text>
  </g>
</svg>
